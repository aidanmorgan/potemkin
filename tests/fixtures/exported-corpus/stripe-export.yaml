openapi: 3.0.3
info:
  title: Stripe exported-example verification contract
  version: 1.0.0
paths:
  /v1/charges:
    get:
      responses:
        '200':
          description: Stripe list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeList'
  /v1/charges/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stripe charge response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeObject'
