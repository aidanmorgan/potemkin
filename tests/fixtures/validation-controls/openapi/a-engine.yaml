openapi: 3.0.3
info:
  title: Potemkin validation controls engine contract
  version: "1.0.0"
paths:
  /profiles:
    post:
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Administrator scope required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Response contract failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profiles/{id}:
    get:
      operationId: getProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Missing profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ProfileInput:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    Profile:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
        displayName:
          type: string
    Error:
      type: object
      additionalProperties: true
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
