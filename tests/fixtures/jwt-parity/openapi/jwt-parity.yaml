openapi: '3.0.3'
info:
  title: Potemkin JWT authoring parity contract
  version: '1.0.0'
paths:
  /jwt-records:
    post:
      operationId: createJwtRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInput'
      responses:
        '201':
          description: JWT-protected record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '401':
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: JWT does not contain the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RecordInput:
      type: object
      additionalProperties: false
      required: [id, value]
      properties:
        id: { type: string }
        value: { type: string }
    Record:
      type: object
      additionalProperties: false
      required: [id, value, status]
      properties:
        id: { type: string }
        value: { type: string }
        status: { type: string }
    Error:
      type: object
      additionalProperties: true
