openapi: 3.0.3
info:
  title: Potemkin transport observability fixture
  version: 1.0.0
paths:
  /records/bulk:
    post:
      operationId: createRecordBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RecordInput'
      responses:
        '201':
          description: Records created
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Record'
                    - $ref: '#/components/schemas/JsonApiRecord'
                    - $ref: '#/components/schemas/HalRecord'
        '409':
          description: Duplicate record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /records/bulk/{id}:
    get:
      operationId: getRecord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '404':
          description: Record absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bulk-receipts/{id}:
    get:
      operationId: getBulkReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bulk receipt found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReceipt'
        '404':
          description: Bulk receipt absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bulk-audits/{id}:
    get:
      operationId: getBulkAudit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bulk audit found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAudit'
        '404':
          description: Bulk audit absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RecordInput:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Record:
      type: object
      additionalProperties: false
      required: [id, name, source]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
    BulkReceipt:
      type: object
      additionalProperties: false
      required: [id, recordId, kind]
      properties:
        id:
          type: string
        recordId:
          type: string
        kind:
          type: string
    BulkAudit:
      type: object
      additionalProperties: false
      required: [id, recordId, action]
      properties:
        id:
          type: string
        recordId:
          type: string
        action:
          type: string
    JsonApiRecord:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [type, id, attributes]
          properties:
            type:
              type: string
            id:
              type: string
            attributes:
              type: object
              additionalProperties: true
    HalRecord:
      type: object
      additionalProperties: true
      required: [id, name, source, _links]
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
        _links:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
