boundary: BulkAudit
contract_path: /bulk-audits/{id}
identity:
  creation:
    generate: "$uuidv7()"
event_catalog:
  - type: BulkAuditRecorded
    payload_template:
      id: command.targetId
      recordId: command.payload.recordId
      action: "'created'"
behaviors: []
reducers:
  - on: BulkAuditRecorded
    patches:
      - { op: replace, path: /id, value: "${event.payload.id}" }
      - { op: replace, path: /recordId, value: "${event.payload.recordId}" }
      - { op: replace, path: /action, value: "${event.payload.action}" }
