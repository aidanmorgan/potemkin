boundary: OrderById
contract_path: /orders/{id}
schema: Order
fallback_override: true
hateoas:
  - rel: self
    href: /orders/{id}
mask:
  - internalNote
deprecated:
  date: "2026-01-01T00:00:00Z"
  sunset: "2027-01-01T00:00:00Z"
  replacement: /v2/orders
event_catalog:
  - type: OrderRenamed
    payload_template:
      id: event.aggregateId
      name: command.payload.name
behaviors:
  - name: rename-order-dispatch-only
    match:
      operationId: renameOrder
      headers:
        x-parity-dispatch-only: on
      condition: "true"
    dispatch_commands:
      - boundary: Receipt
        intent: creation
        operationId: createReceipt
        target_id: "$concat(command.targetId, '-dispatch-only-receipt')"
        payload:
          orderId: command.targetId
          amount: "1"
  - name: rename-order
    match:
      operationId: renameOrder
      condition: "true"
    emit: OrderRenamed
reducers:
  - on: OrderRenamed
    patches:
      - op: replace
        path: /name
        value: "${event.payload.name}"
