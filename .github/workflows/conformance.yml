name: Specmatic conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specmatic-conformance:
    name: Real Specmatic conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Potemkin
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('plugin/**/*.gradle.kts', 'plugin/gradle.properties', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build the Potemkin Specmatic plugin
        run: ./gradlew shadowJar --no-daemon
        working-directory: plugin

      - name: Run CRM Layer-A conformance
        run: pnpm run test:conformance -- --example crm --max-combinations 2

      - name: Run Stripe Layer-A conformance
        run: pnpm run test:conformance -- --example stripe --max-combinations 2
